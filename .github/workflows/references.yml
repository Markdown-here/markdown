name: References

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build_references.py --check
      - run: python scripts/build_deck.py course/markdown-101/deck.yml course/markdown-101/editions/microsoft-deck.yml --check
