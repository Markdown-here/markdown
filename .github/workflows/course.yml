name: Course

# Builds the Markdown 101 slides and handouts as PDF, HTML, and PowerPoint.
# Every push to main: download them from the run's "markdown-101" artifact.
# Every tag like v0.1: also published as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true" # CI doesn't render diagrams, so skip Chrome for Mermaid

      - name: Stamp version into footers
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          python3 scripts/stamp_version.py "$VERSION"

      - name: Build slides and handouts
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: markdown-101
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
