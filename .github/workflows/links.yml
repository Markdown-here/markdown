name: Links

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,204,206,429
            --exclude-path references/references.json
            './**/*.md'
          fail: true
