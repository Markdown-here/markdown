name: Links

# Weekly only, not on every push: websites go down or block checkers,
# and that shouldn't turn ordinary commits red. Run it by hand from the
# Actions tab when you add a lot of links.
on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,204,206,429
            --exclude-path references/references.json
            './**/*.md'
          fail: true
