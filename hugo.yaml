# The markdown.here website, for people learning Markdown. Hugo builds it from
# the Markdown already in this repo: nothing here is a copy.
# How it works: docs/website.md.

baseURL: https://markdown.here/
title: Markdown.here
locale: en
enableRobotsTXT: true
titleCaseStyle: none # keep tags as written: #cli, not #Cli
disableAliases: true # reference entries use `aliases` for other names, not redirects
resourceDir: .hugo-resources # build cache, not committed

taxonomies:
  tag: tags

outputs:
  home: [html, llms]
  page: [html]
  section: [html]

markup:
  goldmark:
    renderer:
      unsafe: true # allow inline HTML from the source files
  highlight:
    noClasses: false

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra
  mounts:
    # Site-only files: home page, course intros, templates, styles
    - { source: site/content, target: content }
    - { source: site/layouts, target: layouts }
    - { source: site/assets, target: assets }
    - { source: site/static, target: static }
    # The source files. site/content/_content.gotmpl turns them into pages,
    # using `courses` and `sources` below.
    - { source: course, target: assets/src/course }
    - { source: references, target: assets/src/references }
    - { source: microsoft-atlassian, target: assets/src/microsoft-atlassian }
    - { source: media, target: static/media, files: ["*.svg", "*.png", "*.jpg"] }

menu:
  main:
    - { name: Courses, pageRef: /courses, weight: 1 }
    - { identifier: references, name: References, weight: 2 }
    - { name: Resources, pageRef: /resources, parent: references, weight: 1 }
    - { name: Tools, pageRef: /tools, parent: references, weight: 2 }
    - { name: People, pageRef: /people, parent: references, weight: 3 }
    - { name: Organizations, pageRef: /organizations, parent: references, weight: 4 }
    - { name: What works where, pageRef: /microsoft-atlassian, weight: 3 }
    - { name: Search, weight: 4, params: { type: search } }
    - { name: GitHub, weight: 5, url: "https://github.com/Markdown-here/markdown", params: { icon: github } }

params:
  description: Learn Markdown, try it, and find everything else worth knowing about it.
  images: [/images/social-card.png] # preview image when a page is shared

  # Where the source lives. Used for downloads, the footer, and links to files
  # that aren't web pages. If the repo moves, change it here and in the GitHub
  # menu item above.
  repo: https://github.com/Markdown-here/markdown
  branch: main

  # Courses: each deck becomes a lesson, one page per slide, in deck order.
  # Slides marked `<!-- _class: lead -->` or `break` (title, questions,
  # closing, section dividers) are for live sessions and are left out.
  # Speaker notes are left out too. The course's intro page is in site/content.
  courses:
    - { deck: course/markdown-101/deck.yml, path: courses/markdown-101 }
    - { deck: course/markdown-101/editions/microsoft-deck.yml, path: courses/markdown-101-microsoft }

  # Other files that become pages, and where. First match wins. A file mapped
  # to <folder>/README.md becomes that folder's main page. Anything not listed
  # here stays on GitHub only: course plans, contributor docs, templates.
  sources:
    - { from: course/markdown-101/cheatsheet.md, to: courses/markdown-101/cheatsheet.md }
    - { from: course/markdown-101/exercise-before.md, to: courses/markdown-101/exercise-before.md }
    - { from: course/markdown-101/exercise-after.md, to: courses/markdown-101/exercise-after.md }
    - { from: course/markdown-101/editions/microsoft-cheatsheet.md, to: courses/markdown-101-microsoft/cheatsheet.md }
    - { from: course/markdown-101/editions/teams-recap-before.md, to: courses/markdown-101-microsoft/teams-recap-before.md }
    - { from: course/markdown-101/editions/teams-recap-after.md, to: courses/markdown-101-microsoft/teams-recap-after.md }
    - { from: references/resources.md, to: resources/README.md }
    - { from: references/tools.md, to: tools/README.md }
    - { from: references/people.md, to: people/README.md }
    - { from: references/organizations.md, to: organizations/README.md }
    - { from: references/resources/, to: resources/ }
    - { from: references/tools/, to: tools/ }
    - { from: references/people/, to: people/ }
    - { from: references/organizations/, to: organizations/ }
    - { from: microsoft-atlassian/markdown-support.md, to: microsoft-atlassian/README.md }

  # Reference entries in these states aren't published
  hideStates: [draft, broken, retired]

  # Titles and sidebar order for the files above, keyed by repo path. Without a
  # title, a page takes its first `# heading`. `after: <slide>` puts a page
  # right after that lesson (`order` sorts pages after the same lesson).
  # Higher weights go lower in the sidebar.
  pages:
    course/markdown-101/exercise-before.md: { title: "Practice: the messy note", after: exercise, order: 1 }
    course/markdown-101/exercise-after.md: { title: "Practice: one answer", after: exercise, order: 2 }
    course/markdown-101/cheatsheet.md: { weight: 100000 }
    course/markdown-101/editions/teams-recap-before.md: { title: "Practice: the messy recap", after: exercise, order: 1 }
    course/markdown-101/editions/teams-recap-after.md: { title: "Practice: one answer", after: exercise, order: 2 }
    course/markdown-101/editions/microsoft-cheatsheet.md: { weight: 100000 }
    microsoft-atlassian/markdown-support.md: { title: "What works where" }

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  displayUpdatedDate: false
  editURL:
    enable: false
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
      version: "0.8.143"
  mermaid:
    base: https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist # same version as npm run media
  highlight:
    copy:
      enable: true
      display: hover
  page:
    contextMenu:
      enable: false
